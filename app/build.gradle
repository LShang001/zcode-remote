apply plugin: 'com.android.application'

android {
    namespace 'com.zcode.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.zcode.remote"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "2.12"
    }

    buildTypes {
        // 发版走 release:debuggable=false —— debug 包会开 WebView 内容调试(chrome://inspect 可读写
        // 远程会话页)且 adb run-as 可直读 SharedPreferences 里的 sid,不该当正式包发。
        // 签名沿用 debug keystore:老用户已装 debug 签名版本,换签名会导致无法覆盖安装
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 扫码绑定:只用 zxing 的纯 Java 解码核心(不含 Android UI/资源,约 0.5 MB,零传递依赖);
    // 相机预览自己用 Camera1 写,不引入 zxing-android-embedded 全家桶
    implementation 'com.google.zxing:core:3.5.3'
}
