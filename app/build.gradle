apply plugin: 'com.android.application'

android {
    namespace 'com.zcode.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.zcode.remote"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
